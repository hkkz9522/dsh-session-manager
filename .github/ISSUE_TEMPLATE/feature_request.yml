name: "功能建议 / Feature Request"
description: "提出新功能、改进建议或交互优化 / Suggest a new feature, improvement, or UX enhancement"
title: "[Feature]: "
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请尽量说明使用场景、当前痛点和期望结果。
        Thank you for your suggestion. Please describe the use case, current pain point, and desired outcome as clearly as possible.

  - type: textarea
    id: problem
    attributes:
      label: "相关问题 / Problem or Motivation"
      description: "这个建议是为了解决什么问题？ / What problem or pain point would this feature solve?"
      placeholder: "例如：当我……时，目前需要…… / For example: When I ..., I currently have to ..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "期望的功能 / Proposed Feature"
      description: "你希望 dsh-session-manager 增加或改变什么？ / What would you like dsh-session-manager to add or change?"
      placeholder: "请描述理想行为或交互方式。 / Describe the desired behavior or workflow."
    validations:
      required: true

  - type: textarea
    id: suggested-change
    attributes:
      label: "修改建议 / Suggested Change"
      description: "如果你已经想到具体的修改方式、界面调整、API 设计或实现方向，请写在这里。 / If you already have a concrete idea for code changes, UI changes, API design, or implementation direction, describe it here."
      placeholder: "可选 / Optional"
    validations:
      required: false

  - type: textarea
    id: use-case
    attributes:
      label: "使用场景 / Use Case"
      description: "请举例说明该功能在什么情况下有用。 / Give an example of when this feature would be useful."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案 / Alternatives Considered"
      description: "目前有没有临时解决方案？你是否考虑过其他实现方式？ / Are there any current workarounds or alternative approaches you considered?"
      placeholder: "可选 / Optional"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: "其他信息 / Additional Context"
      description: "可以补充截图、草图、相关链接或其他背景信息。 / Add screenshots, mockups, links, or any other context."
      placeholder: "可选 / Optional"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: "提交前检查 / Checklist"
      options:
        - label: "我已搜索现有 Issue，确认没有相同或高度相似的建议。 / I searched existing issues and did not find the same or a very similar request."
          required: true
