name: "Bug 报告 / Bug Report"
description: "报告可复现的问题 / Report a reproducible problem"
title: "[Bug]: "
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告。请尽量完整填写以下信息，以便快速定位问题。
        Thank you for reporting a bug. Please provide as much information as possible so the issue can be reproduced and diagnosed efficiently.

  - type: input
    id: plugin-version
    attributes:
      label: "dsh-session-manager 版本 / Version"
      description: "请填写当前安装的插件版本。 / Please provide the installed plugin version."
      placeholder: "例如 / e.g. 0.2.0-rc.2"
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: "DSH 版本 / DSH Version"
      description: "请填写当前使用的 DeepSeek Harness 版本。 / Please provide the DeepSeek Harness version you are using."
      placeholder: "例如 / e.g. 0.5.4"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "运行环境 / Environment"
      description: "问题出现在哪个环境？ / Where does the problem occur?"
      options:
        - "Web UI"
        - "Desktop app / 桌面应用"
        - "Standalone CLI/runtime / 独立 CLI 或运行时"
        - "Other / 其他"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: "操作系统 / Operating System"
      description: "请填写操作系统及版本。 / Please provide the operating system and version."
      placeholder: "例如 / e.g. Windows 11 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: "Node.js 版本 / Node.js Version"
      description: "使用 standalone CLI/runtime 时请填写；其他环境可填写 N/A。 / Required for standalone CLI/runtime; otherwise enter N/A."
      placeholder: "例如 / e.g. 22.15.0 / 24.x / N/A"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "问题描述 / Problem Description"
      description: "请清楚描述遇到的问题。 / Clearly describe what went wrong."
      placeholder: "请描述问题现象。 / Tell us what happened."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "复现步骤 / Steps to Reproduce"
      description: "请提供能够稳定复现问题的最小步骤。 / Provide the smallest reliable sequence of steps that reproduces the problem."
      placeholder: |
        1. 打开 / Open ...
        2. 点击 / Click ...
        3. 选择 / Select ...
        4. 出现 / See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "预期行为 / Expected Behavior"
      description: "你期望发生什么？ / What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "实际行为 / Actual Behavior"
      description: "实际发生了什么？如有错误信息，请尽量完整粘贴。 / What actually happened? Include the exact error message when possible."
    validations:
      required: true

  - type: textarea
    id: suggested-change
    attributes:
      label: "修改建议 / Suggested Change"
      description: "如果你对修复方式或改进方向有想法，请写在这里。 / If you have ideas for a possible fix or improvement, please describe them here."
      placeholder: "可选 / Optional"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "日志 / 截图 / Logs / Screenshots"
      description: "可粘贴相关日志或拖入截图。提交前请移除密码、Token、私人路径等敏感信息。 / Paste relevant logs or drag screenshots here. Remove passwords, tokens, private paths, and other sensitive information first."
      placeholder: "可选 / Optional"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: "其他信息 / Additional Context"
      description: "任何有助于复现或定位问题的其他信息。 / Add anything else that may help reproduce or diagnose the problem."
      placeholder: "可选 / Optional"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: "提交前检查 / Checklist"
      options:
        - label: "我已搜索现有 Issue，确认没有重复问题。 / I searched existing issues and did not find a duplicate."
          required: true
        - label: "我已从日志和截图中移除密码、Token、私人路径等敏感信息。 / I removed passwords, tokens, private paths, and other sensitive information from logs/screenshots."
          required: true
