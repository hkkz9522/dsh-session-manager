name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Both halves must stay parseable (the client bundle is a plain
      # loader-factory file, no build step).
      - run: node --check lib/index.js
      - run: node --check lib/client.js
      # The published package must contain exactly the runtime artifacts.
      # (dry-run doesn't write a tarball, so assert the manifest from JSON.)
      - run: npm pack --dry-run
      - name: assert package contents
        run: |
          npm pack --dry-run --json | node -e "
            let s=''; process.stdin.on('data',d=>s+=d); process.stdin.on('end',()=>{
              const j=JSON.parse(s)[0];
              const files=j.files.map(f=>f.path);
              for (const need of ['lib/index.js','lib/client.js','cordis.patch.yml','package.json','README.md','README.zh.md','LICENSE']) {
                if (!files.includes(need)) { console.error('missing ' + need); process.exit(1); }
              }
              console.log('package contents ok: ' + files.join(', '));
            });"
